name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '.github/APPS.md'
      - 'README.md'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-source:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(toJson(github.event.commits), 'apps.json') || contains(toJson(github.event.commits), '.github/scripts/')
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: '.github/requirements.txt'

      - name: Install dependencies
        run: pip install -r .github/requirements.txt

      - name: Validate Apps JSON
        run: python3 .github/scripts/validate_apps.py

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECONCILE_CACHED_ASSETS: '1'
          RECONCILE_APPLY: '1'
          RECONCILE_MIN_AGE_DAYS: '1'
        run: python .github/scripts/update_source.py

      - name: Auto-format files
        run: |
          for f in $(find . -type f -not -path "*/\.git/*" -not -path "*/\.github/workflows/*" -not -path "*/\.venv/*" -not -path "*/__pycache__/*" \( -name "*.json" -o -name "*.md" -o -name "*.py" -o -name "*.yml" -o -name "*.yaml" -o -name "*.html" -o -name "*.css" -o -name "*.js" \)); do
            if grep -q '[[:space:]]$' "$f" 2>/dev/null; then
              sed -i 's/[[:space:]]*$//' "$f"
            fi
            perl -i -0pe 's/\n{3,}/\n\n/g' "$f"
            if [ -s "$f" ] && [ "$(tail -c 1 "$f")" != "$(printf '\n')" ]; then
              echo "" >> "$f"
            fi
          done

      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git commit -m "Update source.json and app lists"

            MAX_RETRIES=5
            RETRY_COUNT=0
            until git pull --rebase && git push; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "Failed to push after $MAX_RETRIES attempts."
                exit 1
              fi
              echo "Push failed, retrying in $((RETRY_COUNT * 2)) seconds..."
              sleep $((RETRY_COUNT * 2))
            done
          fi

  build-pages:
    needs: [update-source]
    if: |
      always() &&
      (needs.update-source.result == 'success' || needs.update-source.result == 'skipped') &&
      (github.event_name != 'schedule' || needs.update-source.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build site
        run: |
          mkdir public
          cp website/index.html public/
          cp -r website/css public/
          cp -r website/js public/
          cp -r .github/assets public/assets

          mkdir -p public/sources/standard/original public/sources/standard/coexist public/sources/nsfw/original public/sources/nsfw/coexist
          [ -f sources/standard/original/source.json ] && cp sources/standard/original/source.json public/sources/standard/original/
          [ -f sources/standard/coexist/source.json ] && cp sources/standard/coexist/source.json public/sources/standard/coexist/
          [ -f sources/nsfw/original/source.json ] && cp sources/nsfw/original/source.json public/sources/nsfw/original/
          [ -f sources/nsfw/coexist/source.json ] && cp sources/nsfw/coexist/source.json public/sources/nsfw/coexist/

          BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          AUTHOR="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"

          sed -i "s|{{BASE_URL}}|$BASE_URL|g" public/index.html
          sed -i "s|{{AUTHOR}}|$AUTHOR|g" public/index.html

          sed -i "s|{{AUTHOR}}|$AUTHOR|g" public/js/modules/config.js
          sed -i "s|{{REPO}}|$REPO|g" public/js/modules/config.js

          CACHE_BUST=$(date +%s)
          sed -i "s|js/modules/main.js|js/modules/main.js?v=$CACHE_BUST|g" public/index.html
          sed -i "s|css/flat.css|css/flat.css?v=$CACHE_BUST|g" public/index.html

          cat <<EOF > public/manifest.json
          {
              "name": "iOS Sideload Source",
              "short_name": "iOS Sideload Source",
              "description": "AltStore, SideStore & LiveContainer app sources.",
              "start_url": "./?source=pwa",
              "display": "standalone",
              "background_color": "#111827",
              "theme_color": "#2563eb",
              "icons": [
                  {
                      "src": "assets/apple-touch-icon.png",
                      "sizes": "1024x1024",
                      "type": "image/png",
                      "purpose": "any"
                  }
              ]
          }
          EOF

          cat <<EOF > public/robots.txt
          User-agent: *
          Allow: /

          Sitemap: ${BASE_URL}sitemap.xml
          EOF

          CURRENT_DATE=$(date +"%Y-%m-%d")
          cat <<EOF > public/sitemap.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
             <url>
                <loc>${BASE_URL}</loc>
                <lastmod>${CURRENT_DATE}</lastmod>
                <changefreq>daily</changefreq>
                <priority>1.0</priority>
             </url>
          </urlset>
          EOF

          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy-pages:
    needs: [build-pages]
    if: always() && needs.build-pages.result == 'success'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
